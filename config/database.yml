default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>

primary: &primary
  <<: *default

development:
  primary: *primary
  queue: *primary
  cache: *primary
  errors: *primary

test:
  primary: *primary
  queue: *primary
  cache: *primary
  errors: *primary

production:
  primary: *primary
  queue: *primary
  cache: *primary
  errors: *primary
