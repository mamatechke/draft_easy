# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#

# DEFAULT CONNECTION CONFIGURATION FOR POSTGRESQL
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV["PGUSER"] || ENV["POSTGRES_USER"] || "postgres" %>
  password: <%= ENV["PGPASSWORD"] || ENV["POSTGRES_PASSWORD"] %>
  host: <%= ENV["PGHOST"] || ENV["POSTGRES_HOST"] || "localhost" %>
  port: <%= ENV["PGPORT"] || ENV["POSTGRES_PORT"] || 5432 %>


# DATABASE CONFIGURATIONS
primary: &primary
  <<: *default
  database: <%= ENV["PGDATABASE"] || "draft_easy_#{Rails.env}" %>

queue: &queue
  <<: *default
  migrations_paths: db/queue_migrate
  database: <%= ENV["PGDATABASE_QUEUE"] || "draft_easy_#{Rails.env}_queue" %>

cache: &cache
  <<: *default
  migrations_paths: db/cache_migrate
  database: <%= ENV["PGDATABASE_CACHE"] || "draft_easy_#{Rails.env}_cache" %>

errors: &errors
  <<: *default
  migrations_paths: db/errors_migrate
  database: <%= ENV["PGDATABASE_ERRORS"] || "draft_easy_#{Rails.env}_errors" %>


# ENVIRONMENT CONFIGURATIONS
development:
  primary: *primary
  queue: *queue
  cache: *cache
  errors: *errors


# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary: *primary
  queue: *queue
  cache: *cache
  errors: *errors


# Production uses PostgreSQL (Railway.app compatible)
production:
  primary: *primary
  queue: *queue
  cache: *cache
  errors: *errors
